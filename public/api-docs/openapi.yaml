openapi: 3.0.0
info:
  title: Mustopup REST API Documentation
  description: |
    Dokumentasi REST API internal dan integrasi pihak ketiga untuk platform top-up game **Mustopup**.
    Seluruh proses pertukaran data menggunakan format **JSON** melalui protokol **HTTP/HTTPS**.
  version: 1.0.0
servers:
  - url: /
    description: Server Relatif Aktif (Domain Hostinger Anda)
  - url: https://mustopup.com
    description: Server Produksi Utama
paths:
  /checkout:
    post:
      summary: Endpoint Checkout
      description: Memproses pesanan top-up yang dikirimkan oleh pengguna, melakukan validasi, menyimpan transaksi ke database, dan membuat invoice pembayaran melalui API Tripay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - game_id
                - player_id
                - product_id
                - payment_method
              properties:
                game_id:
                  type: string
                  description: Slug/ID game yang akan di-topup.
                  example: "mobile-legends"
                player_id:
                  type: string
                  description: ID Player / User ID game.
                  example: "123456789"
                zone_id:
                  type: string
                  description: ID Zone / Server game (opsional).
                  example: "1234"
                product_id:
                  type: integer
                  description: ID unik produk/layanan yang dibeli.
                  example: 15
                payment_method:
                  type: string
                  description: Kode metode pembayaran yang digunakan.
                  example: "QRIS"
      responses:
        '200':
          description: Berhasil (HTTP 200 OK)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  order_id:
                    type: string
                    example: "ORD-202600001"
                  invoice_url:
                    type: string
                    example: "https://tripay.co.id/..."
                  payment_method:
                    type: string
                    example: "QRIS"
                  status:
                    type: string
                    example: "UNPAID"
        '400':
          description: Gagal (HTTP 400 Bad Request)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Data transaksi tidak lengkap."

  /callback/tripay:
    post:
      summary: Endpoint Callback Tripay
      description: Menerima notifikasi pembayaran (webhook callback) secara asinkron dari Tripay dan memperbarui status transaksi menjadi PAID jika valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reference
                - merchant_ref
                - status
                - signature
              properties:
                reference:
                  type: string
                  description: Kode referensi unik pembayaran dari Tripay.
                  example: "T123456789"
                merchant_ref:
                  type: string
                  description: Kode invoice/Order ID di sistem Mustopup.
                  example: "ORD-202600001"
                status:
                  type: string
                  description: Status pembayaran terbaru.
                  example: "PAID"
                signature:
                  type: string
                  description: Signature HMAC-SHA256 untuk memverifikasi keaslian pengirim callback.
                  example: "xxxxxxxxxxxxxxxx"
      responses:
        '200':
          description: Berhasil (HTTP 200 OK)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Webhook berhasil diproses."
        '403':
          description: Ditolak (HTTP 403 Forbidden)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Signature tidak valid."

  /callback/digiflazz:
    post:
      summary: Endpoint Callback Digiflazz
      description: Menerima hasil pemrosesan transaksi dari Digiflazz setelah proses top-up selesai dilakukan, memperbarui status pesanan, dan menyimpan Serial Number (SN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ref_id
                - status
                - sn
              properties:
                ref_id:
                  type: string
                  description: Kode invoice/Order ID di sistem Mustopup.
                  example: "ORD-202600001"
                status:
                  type: string
                  description: Status transaksi dari Digiflazz (Sukses/Gagal).
                  example: "Sukses"
                sn:
                  type: string
                  description: Serial Number (SN) bukti pengiriman voucher/topup.
                  example: "MLBB-987654321"
      responses:
        '200':
          description: Berhasil (HTTP 200 OK)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Status transaksi diperbarui."
        '400':
          description: Gagal (HTTP 400 Bad Request)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Data callback tidak valid."

  /invoice/{id}:
    get:
      summary: Endpoint Detail Invoice
      description: Menampilkan informasi pembayaran detail berdasarkan Order ID/invoice ID.
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID dari transaksi.
          schema:
            type: string
          example: "ORD-202600001"
      responses:
        '200':
          description: Berhasil (HTTP 200 OK)
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id:
                    type: string
                    example: "ORD-202600001"
                  status:
                    type: string
                    example: "PAID"
                  payment_method:
                    type: string
                    example: "QRIS"
                  amount:
                    type: integer
                    example: 50000
                  serial_number:
                    type: string
                    example: "MLBB-987654321"
        '404':
          description: Gagal (HTTP 404 Not Found)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invoice tidak ditemukan."

  /history:
    get:
      summary: Endpoint Riwayat Transaksi
      description: Menampilkan sepuluh data riwayat transaksi terakhir yang dimiliki oleh pengguna.
      responses:
        '200':
          description: Berhasil (HTTP 200 OK)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        order_id:
                          type: string
                          example: "ORD-202600001"
                        status:
                          type: string
                          example: "SUCCESS"
                        amount:
                          type: integer
                          example: 50000
        '403':
          description: Ditolak (HTTP 403 Forbidden)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unauthorized."

  /digiflazz/order:
    post:
      summary: Request Order ke Digiflazz
      description: Endpoint simulasi pengiriman pesanan top-up H2H (Host-to-Host) dari Laravel ke API Digiflazz setelah status transaksi PAID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - buyer_sku_code
                - customer_no
                - ref_id
                - sign
              properties:
                username:
                  type: string
                  description: Username akun Digiflazz Anda.
                  example: "mustopup"
                buyer_sku_code:
                  type: string
                  description: Kode SKU produk dari Digiflazz (e.g. ML86).
                  example: "ML86"
                customer_no:
                  type: string
                  description: Nomor ID Player tujuan top-up.
                  example: "123456789(1234)"
                ref_id:
                  type: string
                  description: Referensi unik transaksi dari sistem Mustopup.
                  example: "ORD-202600001"
                sign:
                  type: string
                  description: Signature MD5 (MD5 dari username + apiKey + ref_id).
                  example: "3b9e5d4d6d9cxxxxxxxxxxxxxxxx"
      responses:
        '200':
          description: Pesanan Diterima oleh Digiflazz (HTTP 200 OK)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ref_id:
                        type: string
                        example: "ORD-202600001"
                      buyer_sku_code:
                        type: string
                        example: "ML86"
                      customer_no:
                        type: string
                        example: "123456789(1234)"
                      status:
                        type: string
                        example: "Pending"
                      message:
                        type: string
                        example: "Pesanan diterima"
