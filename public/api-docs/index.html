<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Mustopup API Documentation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Load Swagger UI CSS -->
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================================
           PREMIUM CYBERPUNK DARK THEME FOR SWAGGER UI
           ============================================================ */
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: #1f2937;
            --accent-cyan: #00ffff;
            --accent-purple: #b300ff;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --border-color: rgba(0, 255, 255, 0.12);
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
        }

        /* Topbar Header */
        .api-header {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.08) 0%, rgba(179, 0, 255, 0.06) 50%, rgba(57, 255, 20, 0.04) 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .api-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .api-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            margin: 0;
            letter-spacing: 1px;
        }

        .back-btn {
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.2);
            color: var(--accent-cyan);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        /* Swagger Container Customization */
        #swagger-ui {
            padding: 1rem 2rem 3rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Override Swagger UI styles for dark theme */
        .swagger-ui {
            filter: invert(88%) hue-rotate(180deg);
        }
        
        /* Fine-tuning inverted components for better readability */
        .swagger-ui .info .title,
        .swagger-ui .scheme-container,
        .swagger-ui .opblock .opblock-summary-operation-id,
        .swagger-ui .opblock .opblock-summary-path,
        .swagger-ui .opblock .opblock-summary-description,
        .swagger-ui table thead tr td, 
        .swagger-ui table thead tr th,
        .swagger-ui .parameter__name,
        .swagger-ui .parameter__type,
        .swagger-ui .response-col_status,
        .swagger-ui .tabli,
        .swagger-ui .response-col_description,
        .swagger-ui .opblock-description-wrapper p,
        .swagger-ui .dialog-ux .modal-ux-header h3 {
            color: #111 !important;
        }
        
        .swagger-ui .opblock.opblock-post {
            border-color: #49cc90;
            background: rgba(73, 204, 144, 0.1);
        }
        
        .swagger-ui .opblock.opblock-get {
            border-color: #61affe;
            background: rgba(97, 175, 254, 0.1);
        }

        /* Smooth Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <header class="api-header">
        <div class="api-brand">
            <h1 class="api-title">MUSTOPUP DEVELOPER HUB</h1>
        </div>
        <a href="/dashboard" class="back-btn">← Kembali ke Dashboard</a>
    </header>

    <div id="swagger-ui"></div>

    <!-- Load Swagger UI JS -->
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            // Build a system
            const ui = SwaggerUIBundle({
                url: "openapi.yaml",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "BaseLayout"
            });
            window.ui = ui;
        };
    </script>
</body>
</html>
